<div class="quidditch-eye-container">
  <div
    class="hud-resistance"
    *ngIf="currentPhase !== 'victory' && currentPhase !== 'loss'"
  >
    <div class="resistance-label">
      Resistenza di Harry: {{ displayResistance }}%
    </div>
    <div class="resistance-bar-track">
      <div
        class="resistance-bar-fill"
        [style.width.%]="displayResistance"
        [class.critical]="displayResistance < 30"
      ></div>
    </div>
  </div>

  <!-- FASE 1 -->
  <div
    class="phase-stage phase-observation"
    *ngIf="currentPhase === 'observation'"
  >
    <div class="background-pitch"></div>
    <div class="harry-shaking-entity">
      <img src="assets/img/Part7/harry_broom.png" alt="Harry sulla scopa" />
    </div>

    <div class="action-footer">
      <button class="btn-binoculars" (click)="openBinoculars()"></button>
    </div>
  </div>

  <!-- FASE 2: VISTA BINOCOLO -->
  <div
    class="phase-stage phase-binoculars"
    *ngIf="currentPhase === 'binoculars'"
  >
    <div class="binocular-overlay"></div>

    <!-- Scena 1: Zoom Harry -->
    <div class="binocular-viewport" *ngIf="binocularScene === 1">
      <img
        src="/assets/img/Part7/quidditch_zoom.png"
        class="zoom-background"
        alt="Pitch Background"
      />

      <div class="harry-zoom-wrapper">
        <img
          src="/assets/img/Part7/harry_zoom.png"
          class="zoom-harry"
          alt="Harry Potter"
        />
      </div>

      <div class="binocular-mask"></div>

      <button class="nav-btn next-scene" (click)="switchBinocularScene(2)">
        Visione Spalti ➔
      </button>
    </div>

    <!-- Scena 2: Spalti -->
    <div class="binocular-viewport" *ngIf="binocularScene === 2">
      <img
        src="assets/img/Part7/spalti_piton.png"
        class="full-screen-spalti"
        alt="Spalti Piton"
      />

      <!-- Pulsante Pulsante su Piton -->
      <button
        class="snape-target-btn"
        (click)="selectSnape()"
        title="Individua Piton"
      ></button>

      <div class="snape-dialog-box">
        <span
          >Hermione: È Piton! Sta fissando la scopa borbottando un
          incantesimo!</span
        >
      </div>

      <button class="nav-btn prev-scene" (click)="switchBinocularScene(1)">
        ⬅ Torna ad Harry
      </button>
    </div>
  </div>

  <!-- FASE 3:-->
  <div
    class="phase-stage phase-trajectory"
    *ngIf="currentPhase === 'trajectory'"
  >
    <div class="interactive-arena" #arenaContainer>
      <img
        src="assets/img/Part7/spalti_quidditch.png"
        class="arena-bg-phase3"
        alt="Spalti Quidditch"
      />

      <svg class="magic-canvas">
        <defs>
          <linearGradient
            id="magicSparkGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#ffea00" />
            <stop offset="50%" stop-color="#ff0055" />
            <stop offset="100%" stop-color="#9d00ff" />
          </linearGradient>
        </defs>

        <path
          *ngIf="magicTrailPath"
          [attr.d]="magicTrailPath"
          class="magic-trail-line"
        />
      </svg>

      <!-- EFFETTO FUMO PER LO STENDARDO -->
      <div
        class="smoke-particle"
        *ngIf="isBannerSmoking"
        [style.left]="smokePosition.left"
        [style.top]="smokePosition.top"
      ></div>

      <!-- BOTTONI-->
      <button
        *ngFor="let obj of availableObjects"
        class="scene-object-btn"
        [style.top]="obj.position.top"
        [style.left]="obj.position.left"
        [style.width]="obj.position.width || 'auto'"
        [disabled]="isSpellCasting"
        (click)="testObjectMagic(obj, $event)"
      >
        <img [src]="obj.imagePath" [alt]="obj.name" class="object-sprite-png" />
        <span class="object-tooltip-tag">{{ obj.name }}</span>
      </button>

      <div *ngIf="isSnapeOnFire" class="snape-fire-overlay">
        <div class="entity-snape" [class.on-fire]="isSnapeOnFire">
          <img src="assets/img/Part7/snape_fire.png" alt="Piton in fiamme" />
        </div>
      </div>
    </div>

    <div class="trajectory-controls">
      <div class="sequence-builder">
        <!-- LISTA DEGLI STEP SCELTI DALL'UTENTE -->
        <div class="sequence-list">
          <div
            *ngFor="let step of selectedSequence; let i = index"
            class="sequence-step"
          >
            <span class="step-num">{{ i + 1 }}.</span>
            <span>{{ step.name }}</span>
            <button
              class="btn-remove"
              (click)="removeSequenceItem(i)"
              [disabled]="isSpellCasting"
            >
              ✕
            </button>
          </div>

          <div
            class="sequence-step target-step"
            *ngIf="selectedSequence.length > 0"
          >
            <span>➔ Mantello di Piton</span>
          </div>
        </div>

        <!-- BOTTONI DI AZIONE -->
        <div class="action-buttons">
          <!-- 1. Bottone per attivare la modalità inserimento -->
          <button
            class="btn-secondary"
            [class.active]="isPlanningMode"
            (click)="togglePlanningMode()"
            [disabled]="isSpellCasting"
          >
            {{ isPlanningMode ? "✏️ Inserimento Attivo" : "Pianifica Magia" }}
          </button>

          <!-- 2. Svuota sequenza -->
          <button
            class="btn-secondary"
            (click)="clearSequence()"
            [disabled]="isSpellCasting || selectedSequence.length === 0"
          >
            Svuota
          </button>

          <!-- 3. Esegui la catena pianificata -->
          <button
            class="btn-magic"
            (click)="castSpell()"
            [disabled]="selectedSequence.length === 0 || isSpellCasting"
          >
            Lancia Incantesimo
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>
  </div>
</div>

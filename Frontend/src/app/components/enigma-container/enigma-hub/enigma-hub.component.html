<app-sorting-hat
  *ngIf="enigmaId === 'QUIZ_CASA'"
  (quizSolved)="onQuizSolved($event)"
></app-sorting-hat>
<app-puzzle-frame
  *ngIf="enigmaId === 'QUIZ_FRAME'"
  (quizSolved)="onQuizSolved($event)"
></app-puzzle-frame>
<app-enigma-broom
  *ngIf="enigmaId === 'ENIGMA_SCOPA'"
  (quizSolved)="onQuizSolved($event)"
></app-enigma-broom>
<app-enigma-door>
  *ngIf="enigmaId === 'DOOR_QUIZ'" (quizSolved)="onQuizSolved($event)"
</app-enigma-door>

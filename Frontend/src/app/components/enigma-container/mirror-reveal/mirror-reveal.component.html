<div class="mirror-game">
  <!-- FASE 1 - ENTRATA NELLA STANZA -->
  <section *ngIf="phase === 'entrance'" class="scene entrance">
    <div class="dark-overlay"></div>

    <div class="scene-content">
      <div class="dialogue">Harry: Cos'è questo posto?</div>

      <button class="magic-button" (click)="approachMirror()">
        Avvicinati allo Specchio
      </button>
    </div>
  </section>

  <!-- FASE 2 - SPECCHIO COPERTO -->
  <section *ngIf="phase === 'covered'" class="scene covered">
    <div class="dark-overlay"></div>
    <div class="mirror-container">
      <div
        class="curtain"
        [class.curtain-open]="curtainOpen"
        (click)="removeCurtain()"
      >
        <div class="curtain-text" *ngIf="!curtainOpen">Rimuovi il telo</div>
      </div>
    </div>
  </section>

  <!-- FASE 2B - SPECCHIO RILEVATO -->
  <section *ngIf="phase === 'revealing'" class="scene revealing">
    <div class="dark-overlay"></div>
    <div class="mirror-container" [class.glowing]="mirrorGlow">
      <div class="blurred-reflection"></div>
    </div>
    <button class="magic-button observe-button" (click)="observeMirror()">
      Osserva
    </button>
  </section>

  <!-- FASE 3 - RICORDI & EASTER EGGS -->
  <!-- FASE MEMORIE & VISIONE FINALE (Unificate nella cornice dello specchio) -->
  <section
    *ngIf="phase === 'memories' || phase === 'vision'"
    class="scene memory-scene"
  >
    <div class="dark-overlay"></div>

    <div
      class="mirror-container magical"
      [class.vision-active]="phase === 'vision'"
    >
      <div class="memory-window">
        <!-- FASE 3: RICORDI E BOCCINO D'ORO -->
        <ng-container *ngIf="phase === 'memories'">
          <img
            *ngIf="currentMemory"
            [src]="currentMemory.image"
            class="memory-image"
            alt="Ricordo dello Specchio"
          />

          <img
            *ngIf="showEgg('isSeeker')"
            src="assets/img/Part7/easterEggs/snitch.png"
            class="snitch-trail-png"
            [class.snitch-flying]="snitchActive"
            alt="Boccino d'Oro"
          />
        </ng-container>

        <ng-container *ngIf="phase === 'vision' && finalVision">
          <img
            class="vision-background"
            [src]="finalVision.image"
            [class.visible]="visionReady"
            alt="Visione dello Specchio"
          />

          <div class="vision-darkening" [class.visible]="visionReady"></div>

          <div class="vision-content" [class.visible]="visionReady">
            <div class="vision-small-title">LO SPECCHIO DELLE BRAME</div>
            <h1>
              {{ finalVision.title }}
            </h1>
            <div class="divider"></div>
            <div class="vision-text">
              <p *ngFor="let line of finalVision.text">
                {{ line }}
              </p>
            </div>
          </div>
        </ng-container>
      </div>

      <div class="magical-particles"></div>
    </div>

    <!-- MESSAGGIO DI ATTESA E PULSANTE IN BASSO -->
    <div class="mirror-footer">
      <div *ngIf="phase === 'memories'" class="mirror-message">
        Lo Specchio osserva i tuoi ricordi...
      </div>

      <button
        *ngIf="phase === 'vision' && visionReady"
        class="magic-button leave-button"
        (click)="leaveMirror()"
      >
        Allontanati dallo Specchio
      </button>
    </div>
  </section>
</div>

<button class="audio-toggle-btn" (click)="toggleAudio()">
  <svg *ngIf="!audioService.isMuted" viewBox="0 0 24 24" class="audio-icon">
    <path
      d="M5 17h3l5 5V2l-5 5H5v10zm11-5c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
    />
  </svg>
  <svg *ngIf="audioService.isMuted" viewBox="0 0 24 24" class="audio-icon">
    <path
      d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
    />
  </svg>
</button>
<div class="broom-container" *ngIf="actualFase === 'broom'">
  <div class="broom-viewport">
    <div class="broom-view"></div>
    <img
      [src]="script0[currentLinebroom].image"
      class="broom-img"
      alt="broom"
    />
    <div class="dialogue-box">
      <div class="dialog-text">
        <p *ngIf="script0[currentLinebroom].character">
          {{ script0[currentLinebroom].character }}
        </p>
        <p>{{ script0[currentLinebroom].text }}</p>
      </div>
    </div>
    <button
      *ngIf="currentLinebroom === 3"
      class="EnterGringott"
      (click)="EnterGringott()"
    >
      Entra nella Gringott
    </button>
  </div>
</div>
<div
  class="Gringott-container"
  *ngIf="actualFase === 'Gringott'"
  (mousemove)="onDragging($event)"
  (touchmove)="onDragging($event)"
  (mouseup)="stopGame()"
  (touchend)="stopGame()"
>
  <div class="Gringott-viewport">
    <div class="Gringott-view">
      <img
        [src]="script1[currentLineGringott].image"
        class="Gringott-img"
        alt="Gringott"
      />

      <div class="dialogue-box" *ngIf="currentLineGringott !== 6">
        <div class="dialog-text">
          <p *ngIf="script1[currentLineGringott].character">
            {{ script1[currentLineGringott].character }}
          </p>
          <p>{{ script1[currentLineGringott].text }}</p>
        </div>
      </div>
      <div class="pression-tube" *ngIf="currentLineGringott === 6">
        <div class="glass-tube">
          <div class="target-line"></div>
          <div
            class="magic-liquid"
            [style.height.%]="(liquidLevel / maxLiquid) * 100"
          ></div>
        </div>

        <div class="valve-control-panel">
          <div class="valve-wrapper">
            <img
              src="assets/img/Part3/ValveA.png"
              class="manopola-img"
              [style.transform]="'rotate(' + angleValveA + 'deg)'"
              (mousedown)="startGame($event, 'A')"
              (touchstart)="startGame($event, 'A')"
              alt="Runa del Fuoco"
            />
          </div>

          <div class="valve-wrapper">
            <img
              src="assets/img/Part3/ValveB.png"
              class="manopola-img"
              [style.transform]="'rotate(' + angleValveB + 'deg)'"
              (mousedown)="startGame($event, 'B')"
              (touchstart)="startGame($event, 'B')"
              alt="Runa dell'Aria"
            />
          </div>

          <div class="valve-wrapper">
            <img
              src="assets/img/Part3/ValveC.png"
              class="manopola-img"
              [style.transform]="'rotate(' + angleValveC + 'deg)'"
              (mousedown)="startGame($event, 'C')"
              (touchstart)="startGame($event, 'C')"
              alt="Runa della Terra"
            />
          </div>
        </div>
      </div>

      <button class="EnterOllivander" (click)="EnterOllivander()">
        Entra da Ollivander
      </button>
    </div>
  </div>
</div>
<div class="Ollivander-container" *ngIf="actualFase === 'Ollivander'">
  <div class="Ollivander-viewport">
    <div class="Ollivander-view">
      <img
        [src]="script2[currentLineOllivander].image"
        class="Ollivander-img"
        alt="OllivanderScene"
      />
      <div
        class="ollivander-enigma-container"
        *ngIf="currentLineOllivander === 3"
      >
        <video
          *ngIf="isBox1Clicked"
          src="assets/video/OlivanderMess1.mp4"
          class="fullscreen-video"
          autoplay
          muted
          playsinline
          (ended)="onBoxWrongEnded()"
        ></video>
        <video
          *ngIf="isBox2Clicked"
          src="assets/video/OlivanderMess1.mp4"
          class="fullscreen-video"
          autoplay
          muted
          playsinline
          (ended)="onBoxWrongEnded()"
        ></video>
        <video
          *ngIf="isBox3Clicked"
          src="assets/video/OlivanderMess1.mp4"
          class="fullscreen-video"
          autoplay
          muted
          playsinline
          (ended)="onBoxWrongEnded()"
        ></video>
        <div class="btn-box">
          <button class="box-1" (click)="clickBox1()"></button>
          <button class="box-2" (click)="clickBox2()"></button>
          <button class="box-3" (click)="clickBox3()"></button>
          <button class="box-4" (click)="clickBox4()"></button>
        </div>
      </div>
      <div class="dialogue-box" *ngIf="currentLineOllivander !== 3">
        <div class="dialog-text">
          <p *ngIf="script2[currentLineOllivander].character">
            {{ script2[currentLineOllivander].character }}
          </p>
          <p>{{ script2[currentLineOllivander].text }}</p>
        </div>
        <button
          *ngIf="currentLineOllivander === 8"
          class="GoToStation"
          (click)="GoToStation()"
        >
          Vai alla stazione
        </button>
      </div>
    </div>
  </div>
</div>

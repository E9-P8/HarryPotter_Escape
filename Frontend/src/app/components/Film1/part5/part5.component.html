<button class="audio-toggle-btn" (click)="toggleAudio()">
  <svg *ngIf="!audioService.isMuted" viewBox="0 0 24 24" class="audio-icon">
    <path
      d="M5 17h3l5 5V2l-5 5H5v10zm11-5c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
    />
  </svg>

  <svg *ngIf="audioService.isMuted" viewBox="0 0 24 24" class="audio-icon">
    <path
      d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
    />
  </svg>
</button>
<div class="GreatHall-container" *ngIf="actualFase === 'GreatHall'">
  <div class="GreatHall-viewport">
    <div class="GreatHall-view"></div>
    <img
      [src]="script0[currentLineGreatHall].image"
      class="GreatHall-img"
      alt="GreatHall"
    />
    <div class="dialogue-box">
      <div class="dialog-text">
        <p *ngIf="script0[currentLineGreatHall].character">
          {{ script0[currentLineGreatHall].character }}
        </p>
        <p>{{ script0[currentLineGreatHall].text }}</p>
      </div>
    </div>
    <button class="goToSpellsClass" (click)="goToSpellsClass()"></button>
  </div>
</div>
<div class="SpellsClass-container" *ngIf="actualFase === 'SpellsClass'">
  <div class="SpellsClass-viewport">
    <div class="SpellsClass-view">
      <img
        [src]="script1[currentLineSpellsClass].image"
        class="SpellsClass-img"
        alt="SpellsClass"
      />

      <div class="SpellsClass-dialogue-box" *ngIf="">
        <div class="dialog-text">
          <p *ngIf="script1[currentLineSpellsClass].character">
            {{ script1[currentLineSpellsClass].character }}
          </p>
          <p>{{ script1[currentLineSpellsClass].text }}</p>
        </div>
      </div>

      <button class="findTroll" (click)="findTroll()"></button>
    </div>
  </div>
</div>
<div class="GirlsBathroom-container" *ngIf="actualFase === 'GirlsBathroom'">
  <div class="GirlsBathroom-viewport">
    <div class="GirlsBathroom-view">
      <img
        *ngIf=""
        [src]="script2[currentLineGirlsBathroom].image"
        class="GirlsBathroom-img"
        alt="GirlsBathroomScene"
      />

      <div class="dialogue-box">
        <div class="dialog-text">
          <p *ngIf="script2[currentLineGirlsBathroom].character">
            {{ script2[currentLineGirlsBathroom].character }}
          </p>
          <p>{{ script2[currentLineGirlsBathroom].text }}</p>
        </div>
        <button class="thirdFloor" (click)="thirdFloor()"></button>
      </div>
    </div>
  </div>
</div>
